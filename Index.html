<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="DATOS/css/style.css">
    <link rel="stylesheet" href="DATOS/css/flores-caen.css">
    <link rel="icon" href="DATOS/img/saimon1.jpg" type="image/x-icon">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background:
                linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                url("DATOS/img/flores.jpg") no-repeat center center fixed !important;
            background-size: cover !important;
        }
        body .greetings span {
            color: #000;
        }

        @keyframes caer-tentus {
            0%   { transform: translateY(0) translateX(0) rotate(0deg); }
            50%  { transform: translateY(55vh) translateX(30px) rotate(180deg); }
            100% { transform: translateY(110vh) translateX(-10px) rotate(360deg); }
        }

    </style>

    <title>FLORES</title>
</head>
<body>
    <div class="greetings">
        <span>💛X</span>
        <span>I</span>
        <span>M</span>
        <span>E💛</span>
    </div>
    <div class="greetings">
        <span>💛X</span>
        <span>I</span>
        <span>M</span>
        <span>E</span>
        <span>N</span>
        <span>A💛</span>
    </div>
    <div class="description">
        <span>SON PARA TI &lt;3</span>
    </div>
    <div class="button">
        <button>
            <a href="DATOS/FLORES.html">CLICK PLEASE</a>
        </button>
    </div>

    <script>
        (function () {
            var IMG = "DATOS/img/tenten.png";


            var capa = document.createElement("div");
            capa.style.cssText =
                "position:fixed;top:0;left:0;width:100%;height:100%;" +
                "pointer-events:none;overflow:hidden;z-index:-1;";
            document.body.appendChild(capa);

            function crearFlor() {
                var f = document.createElement("img");
                var tam = 25 + Math.random() * 35;
                var dur = 6 + Math.random() * 6;

                f.src = IMG;
                f.style.cssText =
                    "position:absolute;top:-80px;" +
                    "left:" + (Math.random() * 100) + "vw;" +
                    "width:" + tam + "px;" +
                    "opacity:" + (0.6 + Math.random() * 0.4) + ";" +
                    "animation:caer-tentus " + dur + "s linear forwards;";
                    
                capa.appendChild(f);
                setTimeout(function () { f.remove(); }, dur * 1000);
            }
            setInterval(crearFlor, 350);
        })();
    </script>
</body>
</html>
