    <style>
        body .mensaje, body .mensaje *,
        body .lluvia, body .lluvia * {
            animation-play-state: running !important;
        }
        .mensaje {
            position: fixed; top: 5vmin; left: 50%;
            transform: translateX(-50%);
            width: 90%; text-align: center;
            z-index: 9999; pointer-events: none;
        }
        .mensaje__titulo {
            font-family: 'Great Vibes', cursive;
            font-weight: normal;
            font-size: 12vmin;
            color: #fff;
            text-shadow: 0 0 1vmin #fce700, 0 0 3vmin rgba(252,231,0,0.7),
                         0 0.2vmin 0.6vmin rgba(0,0,0,0.8);
            animation: mensaje-entrada 2s 1s backwards,
                       mensaje-brillo 3s 3s ease-in-out infinite;
        }
        .mensaje__texto {
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: 4.8vmin;
            margin-top: 1.5vmin;
            color: #fff8c2;
            text-shadow: 0 0 0.8vmin #fce700, 0 0 2.5vmin rgba(252,231,0,0.6),
                         0 0.2vmin 0.6vmin rgba(0,0,0,0.9);
            animation: mensaje-entrada 2s backwards,
                       mensaje-brillo 3s ease-in-out infinite;
        }
        .mensaje__texto:nth-of-type(1) { animation-delay: 2.5s, 4.5s; }
        .mensaje__texto:nth-of-type(2) { animation-delay: 4s,   6s; }
        .mensaje__texto:nth-of-type(3) { animation-delay: 5.5s, 7.5s; }
        .mensaje__texto:nth-of-type(4) { animation-delay: 7s,   9s; }

        @keyframes mensaje-entrada {
            0% { opacity: 0; transform: translateY(-4vmin) scale(0.9); filter: blur(1vmin); }
        }
        @keyframes mensaje-brillo {
            0%, 100% { text-shadow: 0 0 1vmin #fce700, 0 0 3vmin rgba(252,231,0,0.5),
                                    0 0.2vmin 0.6vmin rgba(0,0,0,0.8); }
            50%      { text-shadow: 0 0 2vmin #fff, 0 0 6vmin #fce700,
                                    0 0.2vmin 0.6vmin rgba(0,0,0,0.8); }
        }
        .lluvia {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; pointer-events: none; z-index: 9998;
        }
        .lluvia__flor {
            position: absolute; top: -10vmin; left: var(--x); width: var(--size);
            animation: lluvia-caer var(--dur) linear forwards;
            filter: drop-shadow(0 0 1vmin rgba(252,231,0,0.6));
        }
        @keyframes lluvia-caer {
            0%   { opacity: 0; transform: translate3d(0,0,0) rotate(0deg); }
            10%  { opacity: 1; }
            50%  { transform: translate3d(var(--drift), 55vh, 0) rotate(calc(var(--spin) / 2)); }
            100% { opacity: 0.9; transform: translate3d(calc(var(--drift) * -1), 115vh, 0) rotate(var(--spin)); }
        }
        .destello {
            position: absolute; width: 0.6vmin; height: 0.6vmin; border-radius: 50%;
            background: #fff; box-shadow: 0 0 1vmin #fce700, 0 0 2vmin #fff;
            animation: destello-ans var(--d) ease-in-out infinite;
        }
        @keyframes destello-ans {
            0%, 100% { opacity: 0; transform: scale(0.3); }
            50%      { opacity: 1; transform: scale(1.4); }
        }
    </style>
    <div class="mensaje">
        <h1 class="mensaje__titulo">💛PARA XiME💛</h1>
        <p class="mensaje__texto">Aunque la distancia nos separe,
estas flores amarillas dicen lo que mi silencio no sabe decir:
que te quiero, y que nunca te he olvidado</p>
    </div>

    <div class="lluvia" id="lluvia"></div>

    <script>
    (function () {
        var IMG = "img/tenten.png";
        var lluvia = document.getElementById("lluvia");

        function crearFlor() {
            var f = document.createElement("img");
            var dur = 7 + Math.random() * 7;
            f.src = IMG;
            f.alt = "";
            f.className = "lluvia__flor";
            f.style.setProperty("--x", Math.random() * 100 + "vw");
            f.style.setProperty("--size", (3 + Math.random() * 4) + "vmin");
            f.style.setProperty("--dur", dur + "s");
            f.style.setProperty("--drift", (Math.random() * 16 - 8) + "vmin");
            f.style.setProperty("--spin", (Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 360) + "deg");
            lluvia.appendChild(f);
            setTimeout(function () { f.remove(); }, dur * 1000);
        }
        setInterval(crearFlor, 400); 

        for (var i = 0; i < 40; i++) { 
            var s = document.createElement("span");
            s.className = "destello";
            s.style.left = Math.random() * 100 + "vw";
            s.style.top = Math.random() * 100 + "vh";
            s.style.setProperty("--d", (2 + Math.random() * 3) + "s");
            s.style.animationDelay = Math.random() * 4 + "s";
            lluvia.appendChild(s);
        }
    })();
    </script>
